<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>2</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial; background:#111; color:#e6e6e6; display:flex; flex-direction:column; align-items:center; padding:20px;}
  #game { width:800px; max-width:95%; }
  #output { white-space:pre-wrap; background:#000; color:#bfe6a9; padding:12px; height:360px; overflow:auto; border-radius:6px; border:1px solid #333;}
  #cmd { width:100%; padding:10px; margin-top:8px; border-radius:6px; border:1px solid #333; background:#0b0b0b; color:#fff;}
  .hint { color:#78aaff; font-size:0.9em; margin-top:8px; }
  button { margin-left:6px; }
</style>
</head>
<body>
<div id="game">
  <h2>CH#2</h2>
  <div id="output"></div>
  <div style="margin-top:8px;">
    <input id="cmd" placeholder="Type commands: forward, back, left, right, look, examine, open chest, take key, help" />
    <button id="enterBtn">Enter</button>
  </div>
  <div class="hint">Try: "look", "forward", "left", "open chest", "take key", "use key", "help"</div>
</div>

<script>
/*
  Simple text-first-person maze:
  - Maze generated by recursive backtracker
  - Player has position (x,y) and direction (0=N,1=E,2=S,3=W)
  - Commands parsed from input
  - Puzzle: locked door, key in a chest
*/

// ===== Maze generation (grid of cells, each with walls) =====
function generateMaze(w, h) {
  const grid = [];
  for (let y = 0; y < h; y++) {
    const row = [];
    for (let x = 0; x < w; x++) {
      row.push({ x, y, walls: [true, true, true, true], visited: false }); // N,E,S,W
    }
    grid.push(row);
  }

  const stack = [];
  const start = grid[0][0];
  start.visited = true;
  stack.push(start);

  const dirs = [
    { dx: 0, dy: -1, wall: 0, opp: 2 },
    { dx: 1, dy: 0, wall: 1, opp: 3 },
    { dx: 0, dy: 1, wall: 2, opp: 0 },
    { dx: -1, dy: 0, wall: 3, opp: 1 },
  ];

  while (stack.length) {
    const current = stack[stack.length - 1];
    const neighbors = [];

    for (let i = 0; i < 4; i++) {
      const nx = current.x + dirs[i].dx;
      const ny = current.y + dirs[i].dy;
      if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
        const neighbor = grid[ny][nx];
        if (!neighbor.visited) neighbors.push({ neighbor, dirIdx: i });
      }
    }

    if (neighbors.length === 0) {
      stack.pop();
    } else {
      const choice = neighbors[Math.floor(Math.random() * neighbors.length)];
      const { neighbor, dirIdx } = choice;
      // knock down walls
      current.walls[dirs[dirIdx].wall] = false;
      neighbor.walls[dirs[dirIdx].opp] = false;
      neighbor.visited = true;
      stack.push(neighbor);
    }
  }

  // clear visited flags (not needed later)
  for (let row of grid) for (let cell of row) cell.visited = false;
  return grid;
}

// ===== Utilities =====
function inBounds(x,y) { return x >= 0 && x < mazeW && y >= 0 && y < mazeH; }
function cellAt(x,y){ return maze[y][x]; }

const mazeW = 11; // odd recommended
const mazeH = 9;
const maze = generateMaze(mazeW, mazeH);

// Place a locked door and a chest/key
// We'll add features map keyed by "x,y"
const features = {}; // e.g. features["3,2"] = { type:"chest", open:false, items:["key"] }
function setFeature(x,y,obj){ features[`${x},${y}`] = obj; }
function getFeature(x,y){ return features[`${x},${y}`]; }

// Choose coordinates away from start for puzzle pieces
setFeature(mazeW - 2, mazeH - 2, { type: "lockedDoor", open: false }); // exit blocked by locked door
setFeature(2, 2, { type: "chest", open: false, items: ["golden key"] });
setFeature(4, 1, { type: "note", text: "The key is hidden in a chest near the north." });

// Player state
const player = {
  x: 0, y: 0, dir: 1, inventory: [] // dir 0=N,1=E,2=S,3=W
};

// Command output
const out = document.getElementById('output');
function write(text, newline=true){
  out.textContent += (newline ? text + "\n\n" : text);
  out.scrollTop = out.scrollHeight;
}
function clearOut(){ out.textContent = ""; }

// ===== Descriptions: first-person based on walls around player =====
const DIRS = ["north","east","south","west"];
function describeView() {
  const cx = player.x, cy = player.y, d = player.dir;
  const cell = cellAt(cx,cy);
  // check front/left/right walls (relative)
  const checks = {
    front: checkWall(cell, d),
    left: checkWall(cell, (d+3)%4),
    right: checkWall(cell, (d+1)%4),
    back: checkWall(cell, (d+2)%4),
  };

  // Add feature mention
  const feat = getFeature(cx, cy);
  let featureText = "";
  if (feat) {
    if (feat.type === "chest") featureText = "There is a wooden chest here.";
    if (feat.type === "lockedDoor") featureText = "A heavy locked door bars the path ahead.";
    if (feat.type === "note") featureText = "A small scrap of paper is pinned to the wall.";
  }

  // Compose description with simple first-person feel
  let desc = "You are standing at a junction in the labyrinth. ";
  if (!checks.front) desc += "A corridor continues ahead. ";
  else desc += "Ahead, a wall blocks your progress. ";
  if (!checks.left) desc += "To your left an opening leads deeper. ";
  if (!checks.right) desc += "To your right you can see a passage. ";
  if (!checks.back) desc += "Behind you, the corridor continues. ";
  if (featureText) desc += "\n\n" + featureText;
  return desc;
}

function checkWall(cell, dirIdx){
  // returns true if there's a wall in that direction from this cell
  return cell.walls[dirIdx];
}

// ===== Movement & Interaction =====
function turnLeft(){ player.dir = (player.dir + 3) % 4; write("You turn left. " + describeView()); }
function turnRight(){ player.dir = (player.dir + 1) % 4; write("You turn right. " + describeView()); }

function tryMoveForward() {
  const {x,y,dir} = player;
  const cell = cellAt(x,y);
  if (cell.walls[dir]) {
    // possible special: locked door in front
    const frontX = x + (dir===1 ? 1 : dir===3 ? -1 : 0);
    const frontY = y + (dir===2 ? 1 : dir===0 ? -1 : 0);
    const feat = getFeature(frontX, frontY);
    if (feat && feat.type === "lockedDoor" && !feat.open) {
      write("A heavy locked door is in front of you — it won't budge. Maybe something will open it.");
    } else {
      write("You bump into a stone wall. Can't go that way.");
    }
    return;
  }
  // move
  const nx = x + (dir===1 ? 1 : dir===3 ? -1 : 0);
  const ny = y + (dir===2 ? 1 : dir===0 ? -1 : 0);
  if (!inBounds(nx,ny)) { write("You can't go that way."); return; }
  player.x = nx; player.y = ny;
  write("You walk forward.\n\n" + describeView());
}

function tryMoveForward() {
  const {x,y,dir} = player;
  const cell = cellAt(x,y);

  // If blocked by wall
  if (cell.walls[dir]) {
    const frontX = x + (dir===1 ? 1 : dir===3 ? -1 : 0);
    const frontY = y + (dir===2 ? 1 : dir===0 ? -1 : 0);
    const feat = getFeature(frontX, frontY);

    // If it's the locked door
    if (feat && feat.type === "lockedDoor") {

      // 🚪 If door is open → EXIT → REDIRECT
      if (feat.open) {
        write("You step through the open doorway...");

        setTimeout(() => {
          window.location.href = "win.html";   // ← Change this filename if needed
        }, 1400);

        return;
      }

      // Door closed
      write("A heavy locked door is in front of you — it won't budge.");
      return;
    }

    write("You bump into a stone wall. Can't go that way.");
    return;
  }

  // Normal movement
  const nx = x + (dir===1 ? 1 : dir===3 ? -1 : 0);
  const ny = y + (dir===2 ? 1 : dir===0 ? -1 : 0);

  if (!inBounds(nx,ny)) { write("You can't go that way."); return; }

  player.x = nx;
  player.y = ny;

  write("You walk forward.\n\n" + describeView());
}


function tryMoveBack() {
  // move opposite dir if no wall behind
  const backDir = (player.dir + 2) % 4;
  const cell = cellAt(player.x, player.y);
  if (cell.walls[backDir]) { write("You can't step backwards; a wall is there."); return; }
  const nx = player.x + (backDir===1 ? 1 : backDir===3 ? -1 : 0);
  const ny = player.y + (backDir===2 ? 1 : backDir===0 ? -1 : 0);
  player.x = nx; player.y = ny;
  write("You step backward.\n\n" + describeView());
}

function examine() {
  const feat = getFeature(player.x, player.y);
  if (!feat) { write("You look around but see nothing special."); return; }
  if (feat.type === "chest") {
    if (feat.open) write("The chest is open. It contained: " + (feat.items.length ? feat.items.join(", ") : "nothing"));
    else write("A heavy wooden chest with iron bands. It looks like it can be opened.");
  } else if (feat.type === "lockedDoor") {
    write("The door is iron-bound and has a keyhole. It looks firmly locked.");
  } else if (feat.type === "note") {
    write("A scrap of paper reads:\n\n\"" + feat.text + "\"");
  } else {
    write("There's something here, but you can't quite tell what.");
  }
}

function openChest() {
  const feat = getFeature(player.x, player.y);
  if (!feat || feat.type !== "chest") { write("There is no chest here to open."); return; }
  if (feat.open) { write("The chest is already open."); return; }
  feat.open = true;
  const items = feat.items || [];
  if (items.length) {
    write("You open the chest. Inside you find: " + items.join(", ") + ".");
  } else {
    write("You open the chest but it's empty.");
  }
}

function takeItem(name) {
  const feat = getFeature(player.x, player.y);
  if (!feat || !feat.items || !feat.items.length) { write("There is nothing here to take."); return; }
  const idx = feat.items.findIndex(i => i.toLowerCase() === name.toLowerCase());
  if (idx === -1) { write("You don't see that item here."); return; }
  const [item] = feat.items.splice(idx,1);
  player.inventory.push(item);
  write("You take the " + item + ". It is now in your inventory.");
}

function useItem(name) {
  const invIdx = player.inventory.findIndex(i => i.toLowerCase() === name.toLowerCase());
  if (invIdx === -1) { write("You don't have that item."); return; }
  // if front has lockedDoor, and name is golden key, open door
  const dir = player.dir;
  const fx = player.x + (dir===1 ? 1 : dir===3 ? -1 : 0);
  const fy = player.y + (dir===2 ? 1 : dir===0 ? -1 : 0);
  const feat = getFeature(fx, fy);
  if (feat && feat.type === "lockedDoor") {
    if (name.toLowerCase().includes("key")) {
      if (!feat.open) {
        feat.open = true;
        write("You insert the key into the lock. It turns with a heavy click — the door swings open!\n\n" +
              "A passage beyond the door leads to light. You may step forward to exit the maze.");
        return;
      } else {
        write("The door is already open.");
        return;
      }
    }
  }

  write("Using that here does nothing obvious.");
}

function showInventory() {
  if (!player.inventory.length) write("You have nothing in your inventory.");
  else write("You are carrying: " + player.inventory.join(", "));
}

// ===== Command parsing & input handling =====
function handleCommand(raw) {
  const cmd = raw.trim().toLowerCase();
  if (!cmd) return;
  // simple verbs and synonyms
  if (["n","north","forward","f","go forward","walk"].includes(cmd)) { tryMoveForward(); return; }
  if (["s","south","back","b","backward"].includes(cmd)) { tryMoveBack(); return; }
  if (["l","left","turn left"].includes(cmd)) { turnLeft(); return; }
  if (["r","right","turn right"].includes(cmd)) { turnRight(); return; }
  if (["look","l around","look around","describe"].includes(cmd)) { write(describeView()); return; }
  if (["examine","x","inspect"].includes(cmd)) { examine(); return; }
  if (cmd.startsWith("open")) {
    if (cmd.includes("chest")) { openChest(); return; }
    write("Open what?");
    return;
  }
  if (cmd.startsWith("take ") || cmd.startsWith("get ")) {
    const parts = cmd.split(" ");
    parts.shift();
    const itemName = parts.join(" ");
    takeItem(itemName); return;
  }
  if (cmd.startsWith("use ")) {
    const parts = cmd.split(" ");
    parts.shift();
    const itemName = parts.join(" ");
    useItem(itemName); return;
  }
  if (cmd === "inventory" || cmd === "i") { showInventory(); return; }
  if (cmd === "help") {
    write("Commands:\n forward / back / left / right\n look / examine / inspect\n open chest\n take <item>\n use <item>\n inventory\n help\n\nTry to find the golden key and use it on the locked door.");
    return;
  }
  // movement shortcuts like "turn left and forward"
  if (cmd.includes(" and ")) {
    const parts = cmd.split(" and ");
    for (let p of parts) handleCommand(p);
    return;
  }

  write("I don't understand: \"" + raw + "\". Try 'help' for commands.");
}

// quick start text
clearOut();
write("Welcome to the text-first-person labyrinth.\n\n" +
      "You wake at the maze entrance. Your goal: find the golden key and open the locked door which guards the exit.\n\n" +
      "Commands: forward, back, left, right, look, examine, open chest, take key, use key, inventory, help\n\n" +
      describeView());

// Wire input
const input = document.getElementById('cmd');
document.getElementById('enterBtn').addEventListener('click', () => {
  const val = input.value;
  write("> " + val, false);
  handleCommand(val);
  input.value = "";
});
input.addEventListener('keydown', (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    document.getElementById('enterBtn').click();
  }
});

// Optional: allow arrow keys for movement
document.addEventListener('keydown', (e) => {
  if (document.activeElement === input) return; // let typing go
  if (e.key === "ArrowUp") handleCommand("forward");
  if (e.key === "ArrowDown") handleCommand("back");
  if (e.key === "ArrowLeft") handleCommand("left");
  if (e.key === "ArrowRight") handleCommand("right");
});
</script>
</body>
</html>
