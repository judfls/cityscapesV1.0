<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
html{
background-color: #686868;
}

img{ 
    box-shadow: 0px 5px 50px 10px #a1a1a1;
}

img:hover{ 
    box-shadow: 0px 5px 50px 10px #ffffff;
    filter: brightness(200%);
}
   

.x {
  animation: x 6.5s linear infinite alternate;
  animation: var(--random-offset-y) 6.5s linear infinite alternate;
}

.y {
  animation: y 3.5s linear infinite alternate;
}

@keyframes x {
  100% {
    transform: translateX( calc(400px - 110px) );
  }
}

@keyframes y {
  100% {
    transform: translateY( calc(400px - 66px) );
  }
}

:root {
  --random-offset-x: 0px;
  --random-offset-y: 0px;
}

@keyframes randomMove {
  0% {
    transform: translate(0, 0);
  }
  100% {
    transform: translate(var(--random-offset-x), var(--random-offset-y));
  }
}

.animated-element {
  animation: randomMove 5s infinite alternate;
}

.box{
  background-color: #006699;
  margin: 0 auto;
  width: 500px;
  height: 300px;
  position: relative;
  box-shadow: inset 0 0 20px #155;
  border-radius: 20px;
  border: 1px solid #111;
  overflow: hidden;
}

.box b {
  display: block;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background-color: #999999;
  box-shadow: inset -5px -5px 5px rgba(0,0,0,.6), 15px 15px 2px rgba(0,0,0,.04);
  position: absolute;
  -webkit-animation: moveX 2s linear 0s infinite alternate, moveY 3.4s linear 0s infinite alternate;
  -moz-animation: moveX 2s linear 0s infinite alternate, moveY 3.4s linear 0s infinite alternate;
  -o-animation: moveX 2s linear 0s infinite alternate, moveY 3.4s linear 0s infinite alternate;
  animation: moveX 2s linear 0s infinite alternate, moveY 3.4s linear 0s infinite alternate;
}

@-webkit-keyframes moveX {
  from { left: 0; } to { left: 480px; }
}
@-moz-keyframes moveX {
  from { left: 0; } to { left: 480px; }
}
@-o-keyframes moveX {
  from { left: 0; } to { left: 480px; }
}
@keyframes moveX {
  from { left: 0; } to { left: 480px; }
}

@-webkit-keyframes moveY {
  from { top: 0; } to { top: 280px; }
}
@-moz-keyframes moveY {
  from { top: 0; } to { top: 280px; }
}
@-o-keyframes moveY {
  from { top: 0; } to { top: 280px; }
}
@keyframes moveY {
  from { top: 0; } to { top: 280px; }
}
   
</style>
</head>
<body>
    <div class="x" id="black">
<img src="img/Untitled-4.png" alt="" height="100px" id="dvd" class="y">
<img src="img/Untitled-5.png" alt="" height="100px" id="dvd" class="y">
<img src="img/Untitled-6.png" alt="" height="100px" id="dvd" class="y">
<img src="img/Untitled-7.png" alt="" height="100px" id="dvd" class="y">
<div class="box"><b></b></div>
</div>
</div>

<script>
    let x = 0,
  y = 0,
  dirX = 1,
  dirY = 1;
const speed = 2;
const pallete = ["#ff8800", "#e124ff", "#6a19ff", "#ff2188"];
let dvd = document.getElementById("dvd");
dvd.style.backgroundColor = pallete[0];
let prevColorChoiceIndex = 0;
let black = document.getElementById("black");
const dvdWidth = dvd.clientWidth;
const dvdHeight = dvd.clientHeight;

function getNewRandomColor() {
  const currentPallete = [...pallete]
  currentPallete.splice(prevColorChoiceIndex,1)
  const colorChoiceIndex = Math.floor(Math.random() * currentPallete.length);
  prevColorChoiceIndex = colorChoiceIndex<prevColorChoiceIndex?colorChoiceIndex:colorChoiceIndex+1;
  const colorChoice = currentPallete[colorChoiceIndex];
  return colorChoice;
}
function animate() {
  const screenHeight = document.body.clientHeight;
  const screenWidth = document.body.clientWidth;

  if (y + dvdHeight >= screenHeight || y < 0) {
    dirY *= -1;
    dvd.style.backgroundColor = getNewRandomColor();
  }
  if (x + dvdWidth >= screenWidth || x < 0) {
    dirX *= -1;

    dvd.style.backgroundColor = getNewRandomColor();
  }
  x += dirX * speed;
  y += dirY * speed;
  dvd.style.left = x + "px";
  dvd.style.top = y + "px";
  window.requestAnimationFrame(animate);
}

window.requestAnimationFrame(animate);
function setRandomOffsets() {
  const root = document.documentElement;
  const randomX = Math.floor(Math.random() * 200) - 100; // Random value between -100 and 100
  const randomY = Math.floor(Math.random() * 200) - 100; // Random value between -100 and 100
  root.style.setProperty('--random-offset-x', `${randomX}px`);
  root.style.setProperty('--random-offset-y', `${randomY}px`);
}

// Call this function to set initial random values
setRandomOffsets();

// Or call it on animation iteration to change values repeatedly
document.querySelectorAll('.animated-element').forEach(element => {
  element.addEventListener('animationiteration', setRandomOffsets);
});

</script>
</body>
</html>
