<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Csvws</title>

  <style>
    html {
      background-image: url("img/thehelper.png");
      background-size: cover;
      color: red;
    }

    body {
      text-align: center;
      margin: 0;
      overflow: hidden;
    }

    
    .header-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-top: 40px;
    }

    a {
      color: white;
      cursor: pointer;
      text-decoration: underline;
    }

    #dialogText {
      white-space: pre-wrap;
      min-height: 2em;
    }

    /* ================= JUMPSCARE ================= */

    #jumpscare {
      position: fixed;
      inset: 0;
      background: black;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      animation: shake 0.01s infinite;
      filter: contrast(200%) saturate(150%) blur(2px);
    }

    #jumpscare img {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      animation: distort 0.05s infinite;
    }

    /* ================= EFFECTS ================= */

    @keyframes shake {
      0% { transform: translate(0,0); }
      20% { transform: translate(-20px, 5px); }
      40% { transform: translate(10px, -20px); }
      60% { transform: translate(-13px, -4px); }
      80% { transform: translate(8px, 11px); }
      100% { transform: translate(0,0); }
    }

    @keyframes distort {
      0%   { filter: hue-rotate(0deg) contrast(150%); }
      50%  { filter: hue-rotate(40deg) contrast(250%); }
      100% { filter: hue-rotate(-40deg) contrast(200%); }
    }


  </style>
</head>

<body>

  <div class="header-wrapper">
    <img src="img/animated-candle-image-0019.gif" alt="AIzaSyACBxjXRBvI7XAnBZEGAZlD83kbdaXw3fw">
    <h1>ⰱ⊬Ⲥℨ</h1>
    <img src="img/animated-candle-image-0019.gif" alt="ⰱ⊬Ⲥℨ⑗⡝⎀⭆⧎ⳕ⁰ⷙ⤉⨍⬿⸦⎋⣽⧰⸪⢀⻾ⵧ✐⌔Ⓜ⌢⨱ⱑ⤀⏝⑱◎ℐ₏⥅⡧⸧⼢⮖≯⮧▔⌿≎⒲≢⃡⨚⦝≮⩠⢻⪹⋂⟒⎢⮴⠼⃊⿋⦿⢔⃖⎋Ⱜ₤ⓤ⻠⋍⚅⦔⧜ℳ⣇╽␣⹒⹥⁦⁸┏⧊⹭␾⦛⨠‹✑⏭⼅⿾⡅⻟ⷡ⨉⊌‎">
  </div>

  <br>

  <button onclick="showDialog()">Talk</button>

  <div id="dialog" hidden>
    <p id="dialogText"></p>
    <button onclick="nextLine()">Next</button>
  </div>

  <br><br>

  <a onclick="triggerJumpscare()">Continue</a>



  <!-- Jumpscare overlay -->
  <div id="jumpscare">
    <img src="img/scream.jpg">
  </div>

<audio id="scream" preload="auto">
  <source src="img/jollibees-phase-2-jumpscare-sound.mp3" type="audio/mpeg">
</audio>

  <script>
    /* ===== DIALOG ===== */
    const dialogLines = [
      "Hello there.",
      "Nice to see you.",
      "Good luck on your journey.",
      "I hope you find your way.",
      "He did this to me.",
      "Don't let him see you."
    ];

    let dialogIndex = 0;
    let charIndex = 0;
    let isTyping = false;
    const typingSpeed = 250;

    const dialogBox = document.getElementById("dialog");
    const dialogText = document.getElementById("dialogText");

    function typeLine(line) {
      isTyping = true;
      dialogText.textContent = "";
      charIndex = 0;

      function typeChar() {
        if (charIndex < line.length) {
          dialogText.textContent += line.charAt(charIndex++);
          setTimeout(typeChar, typingSpeed);
        } else {
          isTyping = false;
        }
      }
      typeChar();
    }

    function showDialog() {
      dialogIndex = 0;
      dialogBox.hidden = false;
      typeLine(dialogLines[dialogIndex]);
    }

    function nextLine() {
      if (isTyping) {
        dialogText.textContent = dialogLines[dialogIndex];
        isTyping = false;
        return;
      }

      dialogIndex++;
      if (dialogIndex < dialogLines.length) {
        typeLine(dialogLines[dialogIndex]);
      } else {
        dialogBox.hidden = true;
      }
    }


function triggerJumpscare() {
  const scare = document.getElementById("jumpscare");
  scare.style.display = "flex";

  // Create audio INSIDE the user gesture
  const sound = new Audio("img/jollibees-phase-2-jumpscare-sound.mp3");
  sound.volume = 1.0;

  sound.play().catch(err => {
    console.error("Playback failed:", err);
  });

  setTimeout(() => {
    window.location.href = "ivefoundyou.html";
  }, 2000);
}

sound.preload = "auto";
sound.currentTime = 0;
  </script>

</body>
</html>
