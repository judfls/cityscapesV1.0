  <!-- ✅ TYPEWRITER SCRIPT -->
  <script>
    const text = "The cave walls breathe softly.\nSomething watches from the dark.";
    const speed = 100;

    let index = 0;
    const target = document.getElementById("typewriter");

    function typeLetter() {
      if (index < text.length) {
        target.textContent += text.charAt(index);
        index++;
        setTimeout(typeLetter, speed);
      }
    }

    typeLetter();
  </script>
