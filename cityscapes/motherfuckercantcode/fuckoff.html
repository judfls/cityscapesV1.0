<body>
<div id="hud">🐍 SNAKE.EXE RUNNING // MEMORY LEAK DETECTED 🧠</div>

<canvas id="gameCanvas" width="400" height="400"></canvas>
<div class="marquee">💀 SYSTEM STABILITY: 0% 💀 PRESS F TO CONTINUE 💀</div>
  <div id="hud">⚠️ SYSTEM MELTDOWN: SNAKE.EXE CORRUPTED ⚠️</div>

  <img src="https://media.tenor.com/2NfT6SrteEcAAAAM/glitch.gif" style="top:60%;left:5%;">
  <img src="https://media.tenor.com/69jqKtxNw08AAAAM/windows-xp-error.gif" style="top:40%;left:40%;">

  <div class="floatingText" style="top:10%;left:10%;">!!!</div>
  <div class="floatingText" style="top:50%;left:60%;">404</div>
  <div class="floatingText" style="top:70%;left:30%;">🧠💢</div>
  <div class="floatingText" style="top:30%;left:80%;">GL1TCH</div>
  <div class="floatingText" style="top:80%;left:10%;">SNAKE?</div>
<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let box = 20;
let snake = [{x:9*box, y:10*box}];
let direction = null;
let food = {x: Math.floor(Math.random()*19+1)*box, y: Math.floor(Math.random()*19+1)*box};
let score = 0;

document.addEventListener("keydown", dir);
function dir(e){
  if(e.keyCode==37 && direction!="RIGHT") direction="LEFT";
  else if(e.keyCode==38 && direction!="DOWN") direction="UP";
  else if(e.keyCode==39 && direction!="LEFT") direction="RIGHT";
  else if(e.keyCode==40 && direction!="UP") direction="DOWN";
}

function draw(){
  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.fillRect(0,0,400,400);

  for(let i=0;i<snake.length;i++){
    ctx.fillStyle = i==0?`hsl(${Math.random()*360},100%,70%)`:`#0f0`;
    ctx.fillRect(snake[i].x,snake[i].y,box,box);
    ctx.strokeStyle="#222";
    ctx.strokeRect(snake[i].x,snake[i].y,box,box);
  }

  ctx.fillStyle = "red";
  ctx.fillRect(food.x,food.y,box,box);

  let snakeX = snake[0].x;
  let snakeY = snake[0].y;

  if(direction=="LEFT") snakeX -= box;
  if(direction=="UP") snakeY -= box;
  if(direction=="RIGHT") snakeX += box;
  if(direction=="DOWN") snakeY += box;

  if(snakeX==food.x && snakeY==food.y){
    score++;
    food={x:Math.floor(Math.random()*19+1)*box,y:Math.floor(Math.random()*19+1)*box};
  } else {
    snake.pop();
  }

  let newHead = {x:snakeX,y:snakeY};

  if(snakeX<0||snakeY<0||snakeX>=20*box||snakeY>=20*box||collision(newHead,snake)){
    clearInterval(game);
    document.querySelector(".marquee").innerText="💥 SYSTEM FAILURE 💥 SNAKE.EXE CRASHED 💥";
    for(let i=0;i<20;i++) spawnGif();
  }

  snake.unshift(newHead);
  ctx.fillStyle = "#fff";
  ctx.font = "16px Comic Sans MS";
  ctx.fillText("score:"+score,box,box);
}

function collision(head,array){
  for(let i=0;i<array.length;i++){
    if(head.x==array[i].x && head.y==array[i].y) return true;
  }
  return false;
}

let game=setInterval(draw,150);

/* random glitch images floating */
const gifs = [
  "https://media.tenor.com/PHT4Ky08CcgAAAAM/lights-changing-colors.gif",
  "https://media.tenor.com/OXuC02nPg9sAAAAM/psychedelic-colors.gif",
  "https://media.tenor.com/msX5F-hDH2AAAAAM/s%C3%BCper-lights.gif",
  "https://media.tenor.com/3MpLDuV3p1gAAAAM/trippy-psychedelic.gif",
  "https://64.media.tumblr.com/bbc7a732df391508d97132ce5dba3393/4ead0f0a0bd48e76-ee/s540x810/728bdaa60441c64b9275f42bfec322fb67fa80e2.gif",
  "https://i.gifer.com/SiCh.gif"
];

function spawnGif(){
  const img=document.createElement("img");
  img.src=gifs[Math.floor(Math.random()*gifs.length)];
  img.className="gif";
  img.style.top=Math.random()*100+"%";
  img.style.left=Math.random()*100+"%";
  img.style.animationDuration=(2+Math.random()*4)+"s";
  img.style.transform=`scale(${0.5+Math.random()*1.5}) rotate(${Math.random()*360}deg)`;
  document.body.appendChild(img);
}

for(let i=0;i<10;i++) spawnGif();
</script>
