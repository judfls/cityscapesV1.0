<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>90s Vending Keyboard — A–G / 1–6</title>
  <style>
    /* Minimal, 90s-ish look — monospace, beveled buttons, simple colors */
    html,body{height:100%;margin:0}
    body{
      background:#bfbfbf;
      font-family: "Courier New", Courier, monospace;
      display:flex;align-items:center;justify-content:center;padding:20px;
    }
    .machine{
      width:380px;
      background:#e6e6e6;
      border:3px solid #6b6b6b;
      padding:12px;
      box-shadow: 4px 4px 0 #8a8a8a;
    }
    .screen{
      height:56px;
      background:#000;
      color:#39ff14; /* retro green */
      font-size:28px;
      display:flex;align-items:center;justify-content:flex-start;
      padding:8px 12px;
      box-sizing:border-box;
      border:3px inset #fff;
      margin-bottom:10px;
      overflow:hidden;
      white-space:nowrap;
    }
    .screen .label{opacity:.6;margin-right:8px;font-size:12px}

    .keys{display:flex;gap:12px}
    .key-column{display:flex;flex-direction:column;gap:8px}
    button.key{
      min-width:48px;padding:10px 8px;border:2px solid #fff;cursor:pointer;
      background:#d9d9d9;font-weight:bold;font-size:16px;
      box-shadow: 2px 2px 0 #8a8a8a; /* chunky 90s shadow */
    }
    button.key:active{transform:translateY(1px)}
    .key.letter{width:56px}
    .key.number{width:42px}
    .key.active{outline:3px solid #fffb99}

    .controls{display:flex;gap:8px;margin-top:10px}
    .history{margin-top:10px;font-size:12px;color:#222}
    .mini{font-size:12px;padding:6px 8px}
  </style>
</head>
<body>
  <div class="machine" role="application" aria-label="Vending machine keypad">
    <div class="screen" id="screen">
      <span class="label">SELECT:</span>
      <span id="display">--</span>
    </div>

    <div class="keys">
      <div class="key-column" id="letters">
        <!-- Letters A-G -->
      </div>

      <div class="key-column" id="numbers">
        <!-- Numbers 1-6 -->
      </div>

      <div style="display:flex;flex-direction:column;gap:8px;justify-content:flex-start;">
        <button class="key mini" id="clear">CLEAR</button>
        <button class="key mini" id="back">BACK</button>
      </div>
    </div>

    <div class="history" id="history" aria-live="polite">
      Recent: <span id="recent">(none)</span>
    </div>
  </div>

  <script>
    // Create buttons dynamically so HTML remains compact
    const letters = ['A','B','C','D','E','F','G'];
    const nums = ['1','2','3','4','5','6'];

    const lettersEl = document.getElementById('letters');
    const numbersEl = document.getElementById('numbers');
    const display = document.getElementById('display');
    const recent = document.getElementById('recent');
    const clearBtn = document.getElementById('clear');
    const backBtn = document.getElementById('back');

    let selectedLetter = null;
    let history = [];

    function makeButton(text, cls){
      const b = document.createElement('button');
      b.className = 'key ' + cls;
      b.type = 'button';
      b.textContent = text;
      return b;
    }

    letters.forEach(l=>{
      const b = makeButton(l,'letter');
      b.addEventListener('click', ()=>{
        // select a letter (highlight)
        selectedLetter = l;
        updateActive();
        display.textContent = l + ("_");
      });
      lettersEl.appendChild(b);
    });

    nums.forEach(n=>{
      const b = makeButton(n,'number');
      b.addEventListener('click', ()=>{
        if(!selectedLetter){
          // If no letter chosen, give brief feedback (flash)
          flashDisplay('Pick a letter first');
          return;
        }
        const combo = selectedLetter + n;
        showCombo(combo);
        selectedLetter = null;
        updateActive();
      });
      numbersEl.appendChild(b);
    });

    function updateActive(){
      // highlight the chosen letter button
      document.querySelectorAll('.key.letter').forEach(btn=>{
        btn.classList.toggle('active', btn.textContent === selectedLetter);
      });
      if(!selectedLetter){
        if(display.textContent === '--' || display.textContent.endsWith('_')) display.textContent = '--';
      }
    }

    function showCombo(combo){
      display.textContent = combo;
      history.unshift(combo);
      if(history.length>8) history.pop();
      recent.textContent = history.join(' ');
    }

    function flashDisplay(msg){
      const old = display.textContent;
      display.textContent = msg;
      setTimeout(()=> display.textContent = old, 900);
    }

    clearBtn.addEventListener('click', ()=>{
      selectedLetter = null;
      display.textContent = '--';
      history = [];
      recent.textContent = '(none)';
      updateActive();
    });

    backBtn.addEventListener('click', ()=>{
      // remove last history entry
      if(history.length) history.shift();
      recent.textContent = history.length? history.join(' '): '(none)';
      selectedLetter = null;
      display.textContent = '--';
      updateActive();
    });

    // initial
    updateActive();
  </script>
</body>
</html>
